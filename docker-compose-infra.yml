services:
  mysql:
    image: mysql:8.0-debian
    container_name: mysql
    restart: always
    ports:
      - "127.0.0.1:3306:3306"  # 只监听宿主机回环，同网络的容器用服务名 mysql:3306 互访
    environment:
      MYSQL_ROOT_PASSWORD: abc123456
      MYSQL_DATABASE: xiaozhi
      MYSQL_USER: xiaozhi
      MYSQL_PASSWORD: 123456
      LANG: C.UTF-8
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql   # 持久化数据
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "xiaozhi", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - infra
      - xiaozhi-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"  # 只监听宿主机回环，Redis 无口令，不能对外网可达
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - infra
      - xiaozhi-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

networks:
  infra:
    driver: bridge
  xiaozhi-network:
    external: true
    name: xiaozhi-network

volumes:
  mysql_data:
  redis_data:
