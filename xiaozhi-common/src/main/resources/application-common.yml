# ============================================================
# server 与 dialogue 共享配置
# 两边的 application.yml 通过 spring.config.import 引入本文件；
# 只放两边取值完全相同的项，哪边需要不同的值就写回各自的 application.yml，不要放在这里
# ============================================================

spring:
  autoconfigure:
    # Redisson 的自动配置会顺带提供 RedissonConnectionFactory 当作 RedisConnectionFactory，
    # 且排在 RedisAutoConfiguration 之前，一旦生效上面的 lettuce.pool 就永远不会被读到，
    # 所有 Redis 命令还要绕一层 redisson-spring-data 适配器。RedissonClient 改由
    # com.xiaozhi.common.config.RedissonConfig 显式构建，只用于分布式锁与布隆过滤器。
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
      validation-timeout: 5000
      leak-detection-threshold: 60000
      keepalive-time: 30000

  # Redis 缓存配置
  cache:
    type: redis

  data:
    redis:
      # Redis 服务器地址（Spring Data Redis 和 Redisson 自动共享此配置）
      host: localhost
      port: 6379
      database: 0
      # Redis 开启 requirepass 后用环境变量 SPRING_DATA_REDIS_PASSWORD 提供口令。
      # 此处不能写 password: 空值——Redisson 会把空串当口令发出 AUTH ""，无口令的 Redis 直接报错拒连。
      # 命令超时，避免一次卡住的 Redis 调用拖垮整条请求链路。
      timeout: 3000ms
      # Lettuce 连接池配置：普通命令走的是共享连接（线程安全的多路复用），不经过这个池；
      # 这个池只服务需要独占连接的场景（阻塞命令、事务）。
      # 这份配置要生效，前提是下面把 Redisson 的自动配置排除掉，否则连接工厂会被它抢走。
      lettuce:
        pool:
          max-active: 16    # 最大活跃连接数
          max-idle: 8       # 最大空闲连接数
          min-idle: 2       # 最小空闲连接数
          max-wait: 3s      # 获取连接最大等待时间

  # 禁用Groovy模板位置检查
  groovy:
    template:
      check-template-location: false

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  # 虚拟线程
  threads:
    virtual:
      enabled: true

  # WebSocket 配置
  websocket:
    allowed-origins: '*'

  # MCP 客户端配置
  ai:
    mcp:
      client:
        name: XiaoZhi-MCP-Client
        version: 1.0.0
        request-timeout: 60s
        connect-timeout: 30s
        read-timeout: 30s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false

# ============================================================
# 日志配置
# ============================================================
logging:
  level:
    root: INFO
    org.springframework: INFO
    io.netty.handler: ERROR

# ============================================================
# 小智扩展配置
# ============================================================
xiaozhi:
  # 设备接入鉴权：OTA 下发签名 token，握手校验。留空不鉴权，生产部署必须配。
  # 由环境变量 XIAOZHI_DEVICE_AUTH_SECRET 提供，server 与 dialogue 必须同值。
  device-auth:
    secret: ${XIAOZHI_DEVICE_AUTH_SECRET:xz-2026}
    expire-seconds: 2592000
    allowed-devices:  # 逗号分隔的设备MAC，白名单免 token
  runtime:
    # 本地存储的数据根目录，决定 audio/、uploads/ 这些文件实际落在哪里；入库的路径始终是相对的，不受影响。
    # server 与 dialogue 各自 cd 到自己的目录再启动时，audio/ 会落到两个地方，一边写的录音另一边读不到——
    # 把这里配成两个进程都能访问的同一个绝对路径即可（如 /opt/xiaozhi/data）。
    # 留空表示按各进程的工作目录，与历史行为一致；跨机部署解决不了共享问题，必须改用对象存储。
    data-dir: ${XIAOZHI_DATA_DIR:}
    # 生产环境建议改成绝对路径，避免模型目录和原生库目录依赖启动工作目录
    native-lib-dir: lib
    vosk-model-dir: models/vosk-model
    sense-voice-model-dir: models/sense-voice
    tts-models-dir: models/tts
  operation-log:
    retention-days: 180    # 操作日志保留天数，超期由定时任务清理
  vad:
    model:
      path: models/silero_vad.onnx
    segment-ms: 60000      # STT 单段时长，说到这里换一条识别流继续、各段文本拼接；要留在识别流 90 秒总时长之内
    max-speech-ms: 300000  # 一次说话的总天花板，到点强制收句并回答，之后的话丢弃到停顿为止

# ============================================================
# Sa-Token 认证框架配置（两边共用部分；jwt-secret-key 见各自 application.yml）
# ============================================================
sa-token:
  # Token名称 (同时也是cookie名称)
  token-name: Authorization
  # Token有效期 (单位:秒) 30天 = 2592000秒, -1表示永不过期
  timeout: 2592000
  # Token最低活跃频率 (单位:秒), 如果token超过此时间没有访问系统就会被冻结, -1 表示不限制
  active-timeout: -1
  # 是否允许同一账号多地同时登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时,是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # Token风格 (uuid、simple-uuid、random-32、random-64、random-128、tik)
  token-style: uuid
  # 是否输出操作日志
  is-log: false
  # 是否从cookie中读取token
  is-read-cookie: true
  # 是否从header中读取token
  is-read-header: true
  # token前缀, 例如填写 Bearer 之后客户端应该发送: Bearer {token}
  token-prefix: Bearer
