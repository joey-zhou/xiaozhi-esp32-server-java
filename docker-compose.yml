services:
  mysql:
    image: mysql:8.0-debian
    ports:
      - "127.0.0.1:13306:3306"  # 只监听宿主机回环，容器间用服务名 mysql:3306 互访
    environment:
      - MYSQL_ROOT_PASSWORD=abc123456
      - MYSQL_DATABASE=xiaozhi
      - MYSQL_USER=xiaozhi
      - MYSQL_PASSWORD=123456
      - LANG=C.UTF-8
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    networks:
      - app-network
    volumes:
      - mysql_data:/var/lib/mysql  # 持久化数据
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "xiaozhi", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  node:
    build:
      context: ./web
      dockerfile: ../Dockerfile-node
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8084:8084"
    networks:
      - app-network

  server:
    build:
      context: .
      dockerfile: Dockerfile-server
      target: server
      args:
        - VOSK_MODEL_SIZE=${VOSK_MODEL_SIZE:-small}
        - TTS_MODEL=${TTS_MODEL:-vits-melo-tts-zh_en}
        - DOWNLOAD_PROXY=${BUILD_PROXY:-}
      # 添加构建缓存设置
      cache_from:
        - eclipse-temurin:21-jre
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8091:8091"
    networks:
      - app-network
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/xiaozhi?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=xiaozhi
      - SPRING_DATASOURCE_PASSWORD=123456
      - HOST_IP=${HOST_IP:-}
      # 设备接入鉴权密钥，未导出则不鉴权；.env 被 git 跟踪，不要把真实值写进去
      # 生产部署前 export XIAOZHI_DEVICE_AUTH_SECRET=$(openssl rand -hex 16)
      - XIAOZHI_DEVICE_AUTH_SECRET=${XIAOZHI_DEVICE_AUTH_SECRET:-}
      # 镜像内跑的是 dev profile，logback dev 段把 com.xiaozhi 开到 DEBUG，这里压回 INFO
      - LOGGING_LEVEL_COM_XIAOZHI=INFO
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_AI=INFO
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB_REACTIVE=INFO
      - LOGGING_LEVEL_REACTOR_NETTY_HTTP_CLIENT=INFO
    restart: always  # 自动重启
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  dialogue:
    build:
      context: .
      dockerfile: Dockerfile-server
      target: dialogue
      args:
        - VOSK_MODEL_SIZE=${VOSK_MODEL_SIZE:-small}
        - TTS_MODEL=${TTS_MODEL:-vits-melo-tts-zh_en}
        - DOWNLOAD_PROXY=${BUILD_PROXY:-}
      cache_from:
        - eclipse-temurin:21-jre
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8092:8092"
    networks:
      - app-network
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/xiaozhi?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=xiaozhi
      - SPRING_DATASOURCE_PASSWORD=123456
      - HOST_IP=${HOST_IP:-}
      # 设备接入鉴权密钥，未导出则不鉴权；.env 被 git 跟踪，不要把真实值写进去
      # 生产部署前 export XIAOZHI_DEVICE_AUTH_SECRET=$(openssl rand -hex 16)
      - XIAOZHI_DEVICE_AUTH_SECRET=${XIAOZHI_DEVICE_AUTH_SECRET:-}
      # 镜像内跑的是 dev profile，logback dev 段把 com.xiaozhi 开到 DEBUG，这里压回 INFO
      - LOGGING_LEVEL_COM_XIAOZHI=INFO
      - LOGGING_LEVEL_COM_XIAOZHI_DIALOGUE=INFO
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_AI=INFO
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB_REACTIVE=INFO
      - LOGGING_LEVEL_REACTOR_NETTY_HTTP_CLIENT=INFO
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network
      - xiaozhi-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

networks:
  app-network:
    driver: bridge
  xiaozhi-network:
    driver: bridge
    name: xiaozhi-network

volumes:
  mysql_data:  # 持久化数据卷
  redis_data:  # 持久化Redis数据
