name: backend

# 后端门禁：编译 + 全量单测。测试基本是纯单测（仓库里没有 @SpringBootTest），
# 唯一例外是迁移校验 FlywayMigrationGuardTest，要一个空 MySQL，所以挂了 MySQL service；
# Redis / Qdrant 不需要。
on:
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'xiaozhi-*/**'
      - 'repo/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'pom.xml'
      - 'xiaozhi-*/**'
      - 'repo/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

# 同一分支上新推送直接顶掉旧的排队任务
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 与 docker-compose 一致：应用账号只有库级权限，脚本里需要全局权限的语句会失败；
    # 库名故意不叫 xiaozhi，脚本里写死库名也会失败
    services:
      mysql:
        image: mysql:8.0-debian
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: xiaozhi_ci
          MYSQL_USER: xiaozhi
          MYSQL_PASSWORD: '123456'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uxiaozhi -p123456"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      XIAOZHI_MIGRATION_TEST_URL: jdbc:mysql://127.0.0.1:3306/xiaozhi_ci?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      XIAOZHI_MIGRATION_TEST_USERNAME: xiaozhi
      XIAOZHI_MIGRATION_TEST_PASSWORD: '123456'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # sherpa-onnx 没发布到 Maven Central，从仓库自带的 repo/ 目录解析：
      # 根 pom 的 project-local 仓库地址是 file://${maven.multiModuleProjectDirectory}/repo，
      # 该属性由 mvn 启动脚本置为调用时的工作目录，因此必须在仓库根目录执行。
      - name: Run tests
        run: mvn -B -ntp clean test

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7
