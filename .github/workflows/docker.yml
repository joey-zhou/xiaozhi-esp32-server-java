name: docker

# 发布容器镜像到 GHCR，让使用者 docker compose up 直接拉镜像，不必在自己机器上编译。
# 触发方式：
#   - 打 v 开头的 tag（v1.2.0）→ 发布 1.2.0、1.2、latest 三个标签
#   - 手动触发 → 发布 edge 标签，可选一并构建 arm64
# 日常 push 不触发：一次构建要编译全部 Java 模块、装 Python 依赖并下载约 1.5GB 模型，很慢。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 目标架构
        type: choice
        default: linux/amd64
        options:
          - linux/amd64
          - linux/amd64,linux/arm64

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: xiaozhi-server
            dockerfile: Dockerfile-server
            context: .
            target: server
          - image: xiaozhi-dialogue
            dockerfile: Dockerfile-server
            context: .
            target: dialogue
          - image: xiaozhi-web
            dockerfile: Dockerfile-web
            context: ./web
            target: ''
    steps:
      - uses: actions/checkout@v4

      # server 镜像带模型与 Python 依赖，runner 默认剩余空间不够，先腾出预装的 SDK
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: docker/setup-qemu-action@v3
        if: contains(github.event.inputs.platforms, 'arm64')

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 构建缓存存在 Actions cache 里，下次发布只重跑真正变化的层
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
