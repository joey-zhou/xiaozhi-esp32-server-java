# 静态页面 + API / WebSocket / 后端静态资源反代，全部收敛到 8084
server {
    listen 8084;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100M;

    # 上游写成变量 + resolver，后端容器没起时 nginx 也能正常启动
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream      "server:8091";
    set $dialogue_upstream "dialogue:8092";

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://$api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # 知识库解析是长任务
        proxy_send_timeout 300s;
    }

    # 对话录音与上传文件
    location ~ ^/(audio|uploads)/ {
        proxy_pass http://$api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://$dialogue_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;  # 对话期间长时间无文本往返
        proxy_send_timeout 3600s;
    }
}
